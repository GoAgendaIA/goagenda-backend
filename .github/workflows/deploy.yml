name: Test, Build and Deploy

on:
  push:
    branches: [main]
  # Las pruebas tambien corren en cada PR (a cualquier base: hay PR apilados).
  # Los jobs de build y deploy solo corren en push a main (ver su `if`).
  pull_request:

# Un push nuevo a un PR cancela la corrida anterior de ese PR; en main nunca se
# cancela una corrida en curso (podria cortar un deploy a medias).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # Las pruebas corren primero: si alguna falla, o la cobertura baja de 90%
  # (fail_under en .coveragerc), no se construye la imagen ni se despliega.
  # No necesitan secretos ni el .env: tests/conftest.py usa variables falsas,
  # bloquea la red y reemplaza Supabase/Postgres por dobles en memoria.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Misma version menor que la imagen de produccion (python:3.12-slim en el Dockerfile).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Correr pruebas con cobertura
        run: pytest --cov --cov-report=term-missing

  build-and-push:
    # Solo en main: un PR nunca publica imagenes ni toca el registro.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Solo en main: un PR nunca despliega.
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Deploy por SSH via tunel de Cloudflare
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config << EOF
          Host goagenda
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
          EOF
          ssh goagenda "cd /opt/goagenda/backend && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"
